[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atc-server"
version = "0.1.0"
description = "AI ATC app for the MSFS client. ASR and TTS run as separate services."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=1.26",
    "httpx>=0.27",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "websockets>=13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atc_server"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "services/asr/tests", "services/tts/tests"]
pythonpath = ["src", "services/asr", "services/tts"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "services"]
